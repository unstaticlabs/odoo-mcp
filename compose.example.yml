services:
  odoo-mcp:
    build: .
    restart: unless-stopped
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
      MCP_PUBLIC_ORIGIN: https://mcp.example.com
      MCP_ALLOWED_HOSTS: mcp.example.com
      MCP_ALLOWED_ORIGINS: mcp.example.com
      MCP_DOCUMENT_MATERIALIZATION_ENABLED: "false"
      MCP_ACCESS_SNAPSHOT_MAX_STALE_SECONDS: "86400"
      MCP_ACCESS_REFRESH_TIMEOUT_SECONDS: "120"
      ODOO_TARGETS_JSON: >-
        [{"id":"primary","publicOrigin":"https://odoo.example.com","internalOrigin":"http://odoo:8069","databases":["odoo"]}]
      MCP_OAUTH_ENABLED: "true"
      MCP_OAUTH_DATABASE: /data/oauth.sqlite
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      MCP_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/credential_encryption_key
      MCP_OAUTH_TRUSTED_ORIGINS: https://chatgpt.com,https://claude.ai
      # Add the required values/secrets from docs/observability.md before enabling.
      MCP_ANALYTICS_ENABLED: "false"
    secrets:
      - better_auth_secret
      - credential_encryption_key
    volumes:
      - oauth-data:/data
    networks:
      - odoo
    ports:
      - 127.0.0.1:3000:3000

networks:
  odoo:
    external: true

volumes:
  oauth-data:

secrets:
  better_auth_secret:
    file: ./secrets/better_auth_secret
  credential_encryption_key:
    file: ./secrets/credential_encryption_key
