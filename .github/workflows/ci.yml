name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # The same install the deploy workflow runs. It fails when package.json
      # and package-lock.json disagree.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
