name: Immutable image

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: odoo-mcp-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/unstaticlabs/odoo-mcp

jobs:
  test:
    name: Test exact Odoo MCP source
    runs-on: ubuntu-latest
    outputs:
      evidence_sha256: ${{ steps.evidence.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run complete tests
        run: npm test

      - name: Build production output
        run: npm run build

      - name: Validate agent evaluation corpus
        run: node dist/evals/cli.js validate

      - name: Bind exact source and test evidence
        id: evidence
        run: |
          evidence="$(git ls-files src test evals package.json package-lock.json tsconfig.json release scripts | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          printf '%s\n' "$evidence" | grep -Eq '^[0-9a-f]{64}$'
          echo "sha256=$evidence" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish immutable Odoo MCP image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest_reference: ${{ steps.release.outputs.digest_reference }}
      metadata_artifact: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve immutable component inputs
        id: inputs
        run: |
          digest="$(git ls-files Dockerfile package.json package-lock.json src release scripts | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          printf '%s\n' "$digest" | grep -Eq '^[0-9a-f]{64}$'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse an identical published image
        id: existing
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
          INPUT_DIGEST: ${{ steps.inputs.outputs.digest }}
        run: |
          set +e
          inspection="$(docker buildx imagetools inspect "$IMAGE:$TAG" 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            digest="sha256:$(docker buildx imagetools inspect --raw "$IMAGE:$TAG" | sha256sum | cut -d' ' -f1)"
            reference="$IMAGE@$digest"
            docker pull "$reference"
            docker image inspect "$reference" --format '{{json .Config}}' > image-config.json
            node scripts/image-identity.mjs --config image-config.json --commit "$GITHUB_SHA" --input "$INPUT_DIGEST"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$inspection" | grep -Eqi 'manifest unknown|name unknown|not found|404'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf 'Cannot inspect %s:%s:\n%s\n' "$IMAGE" "$TAG" "$inspection" >&2
            exit "$status"
          fi

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Build and push once
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.inputs.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/unstaticlabs/odoo-mcp.git
            org.opencontainers.image.revision=${{ github.sha }}
            com.unstaticlabs.component.input-sha256=${{ steps.inputs.outputs.digest }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=odoo-mcp
          cache-to: type=gha,mode=max,scope=odoo-mcp

      - name: Resolve and verify immutable identity
        id: release
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
          TAG: ${{ steps.inputs.outputs.tag }}
          INPUT_DIGEST: ${{ steps.inputs.outputs.digest }}
        run: |
          digest="$DIGEST"
          if [ -z "$digest" ]; then
            digest="sha256:$(docker buildx imagetools inspect --raw "$IMAGE:$TAG" | sha256sum | cut -d' ' -f1)"
          fi
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Build produced no valid sha256 digest" >&2
            exit 1
          fi
          reference="$IMAGE@$digest"
          docker pull "$reference"
          docker image inspect "$reference" --format '{{json .Config}}' > image-config.json
          node scripts/image-identity.mjs --config image-config.json --commit "$GITHUB_SHA" --input "$INPUT_DIGEST"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "digest_reference=$reference" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.release.outputs.digest }}
          push-to-registry: true

      - name: Write release metadata
        id: metadata
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          TEST_EVIDENCE: ${{ needs.test.outputs.evidence_sha256 }}
        run: |
          artifact_name="odoo-mcp-release-$GITHUB_SHA"
          printf '%s\n' "$TEST_EVIDENCE" | grep -Eq '^[0-9a-f]{64}$'
          node scripts/release-contract.mjs \
            --commit "$GITHUB_SHA" \
            --image "$IMAGE@$DIGEST" \
            --input '${{ steps.inputs.outputs.digest }}' \
            --evidence "$TEST_EVIDENCE" \
            --output odoo-mcp-release.json
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Publish MCP release as immutable OCI artifact
        id: release_oci
        run: |
          reference="ghcr.io/unstaticlabs/usl-odoo-mcp-release:sha-$GITHUB_SHA"
          oras push --artifact-type application/vnd.usl.odoo-mcp.release.v2+json \
            "$reference" odoo-mcp-release.json:application/json
          digest="$(oras resolve "$reference")"
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "reference=ghcr.io/unstaticlabs/usl-odoo-mcp-release@$digest" >> "$GITHUB_OUTPUT"

      - name: Attest MCP release artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/unstaticlabs/usl-odoo-mcp-release
          subject-digest: ${{ steps.release_oci.outputs.digest }}
          push-to-registry: true

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: odoo-mcp-release.json
          if-no-files-found: error
          retention-days: 90

      - name: Trigger protected GitOps MCP ingestion
        if: vars.USL_MCP_RELEASE_AUTOMATION_ENABLED == 'true'
        env:
          GITOPS_PIPELINE_TRIGGER_URL: ${{ secrets.GITOPS_PIPELINE_TRIGGER_URL }}
          GITOPS_PIPELINE_TRIGGER_TOKEN: ${{ secrets.GITOPS_PIPELINE_TRIGGER_TOKEN }}
          MCP_RELEASE_MANIFEST: ${{ steps.release_oci.outputs.reference }}
        run: |
          test -n "$GITOPS_PIPELINE_TRIGGER_URL"
          test -n "$GITOPS_PIPELINE_TRIGGER_TOKEN"
          curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST "$GITOPS_PIPELINE_TRIGGER_URL" \
            --form "token=$GITOPS_PIPELINE_TRIGGER_TOKEN" \
            --form "ref=main" \
            --form "variables[USL_MCP_RELEASE_MANIFEST]=$MCP_RELEASE_MANIFEST" \
            --form "variables[USL_SOURCE_REPOSITORY]=$GITHUB_REPOSITORY" \
            --form "variables[USL_SOURCE_REF]=$GITHUB_REF" \
            --form "variables[USL_SOURCE_COMMIT]=$GITHUB_SHA" \
            --form "variables[USL_GITHUB_RUN_ID]=$GITHUB_RUN_ID"
