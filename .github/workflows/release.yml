name: Immutable image

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: odoo-mcp-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/unstaticlabs/odoo-mcp
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  publish:
    name: Publish immutable Odoo MCP image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest_reference: ${{ steps.release.outputs.digest_reference }}
      metadata_artifact: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Qualify source
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          node dist/evals/cli.js validate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push once
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/unstaticlabs/odoo-mcp.git
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=odoo-mcp
          cache-to: type=gha,mode=max,scope=odoo-mcp

      - name: Resolve and verify immutable identity
        id: release
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! printf '%s\n' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Build produced no valid sha256 digest" >&2
            exit 1
          fi
          reference="$IMAGE@$DIGEST"
          docker pull "$reference"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$reference" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/unstaticlabs/odoo-mcp.git"
          echo "digest_reference=$reference" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write release metadata
        id: metadata
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          artifact_name="odoo-mcp-release-$GITHUB_SHA"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg image "$IMAGE" \
            --arg tag "$IMAGE_TAG" \
            --arg digest "$DIGEST" \
            '{
              schema: "usl-odoo-mcp-oci-release/v1",
              source: {
                repository: "https://github.com/unstaticlabs/odoo-mcp.git",
                commit: $commit
              },
              image: {
                name: $image,
                tag: $tag,
                digest: $digest,
                digest_reference: ($image + "@" + $digest)
              },
              attestations: {
                oci_sbom: "generated",
                buildkit_provenance: "generated",
                github_provenance: "generated"
              }
            }' > odoo-mcp-release.json
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: odoo-mcp-release.json
          if-no-files-found: error
          retention-days: 90
